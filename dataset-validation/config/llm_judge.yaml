# Mode 2 LLM-as-a-judge (sample of Mode 1 passed rows).

paths:
  # Read {model_slug}/<task>/passed/ from Mode 1
  input_root: data/derived/instruction_generation_validation
  # Write {model_slug}/<task>/llm_judge/{passed,rejected,report.json,done_ids.txt}
  output_root: data/derived/instruction_generation_validation
  # WIPO catalog for ipc_reasoning judge grounding (title + definition)
  ipc_jsonl: data/ipc-codes/ipc_codes_20260101.jsonl

llm:
  provider: openrouter
  model: anthropic/claude-sonnet-4.6
  temperature: 0
  max_tokens: 1024
  timeout_s: 120
  max_retries: 3

judge:
  sample_size: 50
  pass_score_min: 4
  seed: 42
  truncate_chars: 12000
  shard_size: 50
  # Concurrent judge LLM calls. Keep 1 for a serial local server; 8–16 is typical for OpenRouter.
  workers: 12
