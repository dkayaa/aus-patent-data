# Mode 1 programmatic validation (schema/IPC + lexical + semantic).

paths:
  # Holdings root containing {model_slug}/<task>/part-*.jsonl(.gz)
  input_root: data/derived/instruction_generation
  # Writes {output_root}/{model_slug}/<task>/{passed,rejected,report.json}
  output_root: data/derived/instruction_generation_validation

semantic:
  model_name: nomic-ai/nomic-embed-text-v1.5
  batch_size: 8
  # Trained to 8192 (RoPE). MiniLM's 256/512 window truncated most claim bundles.
  max_seq_length: 8192
  trust_remote_code: true
  # Document–document relatedness (Nomic task prefixes are required).
  prefix_a: "search_document: "
  prefix_b: "search_document: "

floors:
  semantic_cosine_min: 0.15
  rouge_l_f1_min: 0.02
  mrc_token_f1_min: 0.1

run:
  shard_size: 100
  # Cap records per task this run (null = all).
  limit: null
