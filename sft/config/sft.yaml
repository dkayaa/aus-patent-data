# QLoRA SFT on frozen eval splits (DigitalOcean / CUDA).

# Seed / teacher holdings used for splits + prepared JSONL (Mode 1 passed/).
# Override with --generator when comparing another teacher.
generator: qwen/qwen3-235b-a22b-2507

paths:
  splits_root: data/derived/evaluation/splits
  output_root: data/derived/sft
  runs_root: data/derived/sft/runs

model:
  # Student HF id (gated Meta Llama — set HF_TOKEN on the droplet).
  name: meta-llama/Llama-3.1-8B-Instruct

train:
  max_seq_length: 4096
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 200
  eval_strategy: steps
  eval_steps: 200
  bf16: true
  packing: false
  seed: 42

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM
