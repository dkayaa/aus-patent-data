# Australian Patent Search API enrichment
# Docs: https://portal.api.ipaustralia.gov.au/s/communityapi/a082w00000TJfb7AAD/developersaustralianpatentsearchapi
# Note: the Design Search portal page is a sibling API; toy seed rows are patents.

api:
  base_url: https://production.api.ipaustralia.gov.au/public/australian-patent-search-api/v1/
  # GET {base_url}/patent/{application_number}
  patent_path_template: /patent/{ip_right_identifier}

auth:
  # OAuth2 client_credentials → Bearer JWT
  token_url: https://production.api.ipaustralia.gov.au/public/external-token-api/v1/access_token
  # Set the env vars named here; do not commit secrets.
  client_id_env: IP_AUSTRALIA_CLIENT_ID
  client_secret_env: IP_AUSTRALIA_CLIENT_SECRET

paths:
  input_csv: data/raw/application-from-2000.csv
  application_number_column: application_number
  # Absolute or repo-relative. Created if missing (parents=True).
  # Writes part-NNNNN.jsonl.gz shards + fetched_ids.txt (resume index).
  output_dir: data/derived/patent_search

fetch:
  # Records per finalized part-NNNNN.jsonl.gz shard
  shard_size: 1000
  # Optional cap on new successful fetches this run (null = no cap)
  max_responses: null
  request_timeout_seconds: 60
  # Steady-state pacing (cap: 500 requests / minute)
  max_requests_per_minute: 500
  # Extra headroom under the cap (0.0–1.0). 0.9 => ~450/min.
  rate_limit_headroom: 0.9
  # Exponential backoff only on retryable errors (429/5xx/network)
  backoff:
    initial_seconds: 1.0
    max_seconds: 60.0
    multiplier: 2.0
    max_retries: 5
