# Synthetic instruction-tuning JSONL generation.

paths:
  patents_dir: data/derived/patent_search_clean
  ipc_jsonl: data/ipc-codes/ipc_codes_20260101.jsonl
  # Holdings root. Records go to {output_dir}/{model_slug}/<task>/;
  # instruction pools stay at {output_dir}/_pools/ (shared across generators).
  output_dir: data/derived/instruction_generation

llm:
  # local = Ollama native /api/chat (not the OpenAI /v1 shim — that path did not
  # honour num_ctx=8192; native does). openrouter = OpenRouter OpenAI API.
  provider: local
  model: llama3.1:8b
  base_url: http://127.0.0.1:11434/v1
  # Env var holding the API key. Local servers often accept any non-empty value.
  # OpenRouter uses OPENROUTER_API_KEY when provider is switched.
  api_key_env: OPENAI_API_KEY
  temperature: 0.7
  # Generation length; also used as max_output_tokens for the input budget.
  max_tokens: 1024
  max_output_tokens: 1024
  # Explicit Ollama context window. Input budget = num_ctx - max_output_tokens - safety_margin.
  num_ctx: 8192
  safety_margin: 64
  # HuggingFace tokenizer for exact prompt token counts (Llama-3 BPE; Meta's
  # gated Meta-Llama-3.1-8B tokenizer is equivalent). Ollama has no tokenize API.
  tokenizer_id: NousResearch/Meta-Llama-3-8B
  # Belt-and-braces: repeat the instruction after the claims so a front-truncating
  # backend still leaves a copy of the instruction at the end.
  repeat_instruction: true
  timeout_s: 120
  max_retries: 3

evol_instruct:
  pool_size: 40
  # Batches of instructions requested per LLM call when filling the pool.
  batch_size: 5

run:
  # Records per output shard part-NNNNN.jsonl.gz
  shard_size: 100
  # Concurrent LLM calls. Keep 1 for a serial local server; 8–16 is typical for OpenRouter.
  workers: 1
  # Cap successful writes this run (null = all pending). Skips do not count.
  limit: null
