# Synthetic instruction-tuning JSONL generation.

paths:
  patents_dir: data/derived/patent_search_clean
  ipc_jsonl: data/ipc-codes/ipc_codes_20260101.jsonl
  # Holdings root. Records go to {output_dir}/{model_slug}/<task>/;
  # instruction pools stay at {output_dir}/_pools/ (shared across generators).
  output_dir: data/derived/instruction_generation

llm:
  # local = Ollama native /api/chat. openrouter = OpenRouter OpenAI API.
  # Teacher is Qwen3-235B-A22B-Instruct-2507. The student is set in sft/config/sft.yaml.
  provider: openrouter
  model: qwen/qwen3-235b-a22b-2507
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  # Generation length; also used as max_output_tokens for the input budget.
  max_tokens: 1024
  max_output_tokens: 1024
  # Input budget = num_ctx - max_output_tokens - safety_margin.
  # Kept at 8192 so a hop the student cannot fit is not sent to the teacher.
  num_ctx: 8192
  safety_margin: 64
  # HuggingFace tokenizer for prompt token counts. Same family as the teacher;
  # only the tokenizer files are downloaded, not the 235B weights.
  tokenizer_id: Qwen/Qwen3-235B-A22B-Instruct-2507
  # Belt-and-braces: repeat the instruction after the claims so a front-truncating
  # backend still leaves a copy of the instruction at the end.
  repeat_instruction: true
  timeout_s: 120
  max_retries: 3

evol_instruct:
  pool_size: 40
  # Batches of instructions requested per LLM call when filling the pool.
  batch_size: 5

tasks:
  ipc_lcpn:
    # Include the patent abstract in every hop. Set false to omit it.
    include_abstract: false
    # claim_1 = independent claim 1 only. omit = no claims text.
    claims: claim_1
    # Teacher writes a short justification, then Classification: <symbol>.
    # Set false to store the symbol only and skip the teacher call.
    justify: false
    # Last row of every child menu. On a path edge, gold is the next place.
    # At the primary place, when it still has children, gold is this token.
    stop_token: "<STOP>"

run:
  # Records per output shard part-NNNNN.jsonl.gz
  shard_size: 100
  # Concurrent LLM calls. 8–16 is typical for OpenRouter.
  workers: 12
  # Cap successful writes this run (null = all pending). Skips do not count.
  limit: null
